<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
     <script src="https://cdn.tailwindcss.com"></script>
    <title>Payoo MFS 2</title>
</head>
<body>
    <main class="flex justify-center items-center h-screen">
        <div class="mockup-phone">
  <div class="camera"></div>
  <div class="display">
    <div class="artboard artboard-demo phone-3">


        <!-- header part start-->

        <div class="stats shadow">
  <div class="stat">
    <div class="stat-title">Amount Balance</div>
    <div id="add-balance" class="stat-value">89400</div>
</div>
</div>

    <div class="divider"></div>

          <!-- feature part end  -->

          <div>

            <button id="show-add-money-form" class="btn btn-lg">Add Money</button>
            <button id="show-cash-out-form" class="btn btn-lg">Cash Out</button>
            <button id="show-transaction-form" class="btn btn-lg">Transaction</button>
          </div>


<div class="divider"></div>
          <!-- add money form start -->
    <div id="add-money-form" class=" hidden card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <form class="card-body">
        <div class="form-control">
          <label class="label">
            <span class="label-text">Amount</span>
          </label>
          <input id="add-amount" type="text" placeholder="Amount" class="input input-bordered" required />
        </div>
        <div class="form-control">
          <label class="label">
            <span class="label-text">PIN</span>
          </label>
          <input id="add-pin" type="password" placeholder="PIN " class="input input-bordered" required />
          
        </div>
        <div class="form-control mt-6">
          <button id="add-money" class="btn btn-primary">Add Money</button>
        </div>
      </form>
    </div>

    <!-- add money form end -->

    <!-- cashout form start -->
     <div id="cash-out-form" class=" hidden card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <form class="card-body">
        <div class="form-control">
          <label class="label">
            <span class="label-text">Amount</span>
          </label>
          <input id="cash-amount" type="text" placeholder="Amount" class="input input-bordered" required />
        </div>
        <div class="form-control">
          <label class="label">
            <span class="label-text">PIN</span>
          </label>
          <input id="cash-out-pin" type="password" placeholder="PIN " class="input input-bordered" required />
          
        </div>
        <div class="form-control mt-6">
          <button id="cash-out" class="btn btn-primary">Cashout</button>
        </div>
      </form>
    </div>
     <!-- cashout form end -->

<!-- transaction form start -->

    <div id="transaction-form" class=" hidden  text-center max-w-sm  ">
      <h1 class="text-3xl font-bold mb-4 text-center">Transaction History</h1>
      <div id="transaction-container" class="space-y-3">

      </div>
    </div>
 <!-- transaction form end -->
    
  </div>

           

    </div>
  </div>
</div>
    </main>

    
</body>
<script src="js/utilities.2.js"></script>
<script src="js/addmoney.js"></script>
<script src="js/cashout.js"></script>
<script src="js/features.js"></script>
</html>
